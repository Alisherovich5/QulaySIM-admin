name: Publish image

# Builds the container in CI and publishes it to GHCR. The deployment server
# only ever pulls the result — source code never lands on it, so a compromised
# host cannot leak the repository, and every deploy is a signed, immutable tag
# rather than whatever happened to be checked out.

on:
  push:
    branches: [main, production-cleanup, payme-integration]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/qulaysim-admin

jobs:
  # The admin had no test step at all: `config/tests_admin_ui.py` and the client
  # address tests existed and nothing ran them, which is the same as not having
  # them. Django's own checks run here too — a broken settings module used to be
  # discovered by the container failing to boot after a deploy.
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qulaysim
          POSTGRES_USER: qulaysim
          POSTGRES_PASSWORD: qulaysim
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      DB_NAME: qulaysim
      DB_USER: qulaysim
      DB_PASSWORD: qulaysim
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django checks
        run: python manage.py check
      - name: Migrations are complete
        # A model changed without `makemigrations` is invisible until the
        # container fails to boot after a deploy.
        run: python manage.py makemigrations --check --dry-run
      - name: Schema doc is current
        # Generated from the live tables, so it cannot go stale silently — the
        # reason it exists is that three production queries were written against
        # guessed column names on the day it was added.
        run: |
          python manage.py migrate --noinput
          python manage.py dump_schema
          git diff --exit-code docs/schema.md || {
            echo "docs/schema.md is out of date — run: python manage.py dump_schema"
            exit 1
          }
      - name: Tests
        # config and catalog for now, not the whole suite: widening it in the
        # same change that introduced the step would mean a pre-existing broken
        # test blocks every deploy, which is a separate decision.
        run: python manage.py test config catalog -v 2

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Built-in token; no personal access token is needed to publish.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache in the registry so a rebuild only redoes what changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Report the immutable tag
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
